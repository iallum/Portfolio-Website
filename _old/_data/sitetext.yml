#
# Work based on https://github.com/mmistakes/minimal-mistakes/blob/master/_data/ui-text.yml
#
# Configuration: Add to _config.yml
# locale: "en-US"  [YOUR PREFERRED LOCALE]
#
# How to use:
# {{ site.data.ui-text[site.locale].<var_name> | default: 'text' }}

# English (default)
# -----------------
#
# Site text configuration for Izzy Allum's Portfolio
# Compatible with raviriley/agency-jekyll-theme
#

# English (default)
# -----------------
en: &DEFAULT_EN
  header:
    title: "Welcome To My Portfolio!"
    text: "It's Nice To Meet You"
    button: "View My Work"
    buttonlink: "#portfolio"

  # Navigation
  nav:
    - title: "About"
      url: "/about/"
    - title: "Portfolio"
      section: portfolio

  # Explicitly disable with null values
  services:
    title: ""
    text: ""
    section: services
    list: []
  
  timeline:
    title: ""
    text: ""
    section: timeline
    events: []
  
  team:
    title: ""
    text: ""
    section: team
    people: []
  
  clients:
    title: ""
    section: clients
    max-height: 0
    list: []
  
  contact:
    title: ""
    text: ""
    section: contact

  # Portfolio section
  portfolio:
    title: "My Projects"
    text: "Here's what I've been working on"
    section: portfolio
    closebutton: "Close Project"

  footer:
    legal: ""
    social:
      - url: https://www.linkedin.com/in/isabel-allum-1335b117a/
        icon: "fab fa-linkedin-in"
      - url: https://github.com/iallum
        icon: "fab fa-github"

en-US:
  <<: *DEFAULT_EN